{% from 'components.html' import render with context %}
<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title><meta name="description" content="{{ site.description }}">
<link rel="icon" href="{{ site.favicon_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>{{ css | safe }}</style>
</head>
<body{% for key, value in site.body.items() %} {{ key }}="{{ value }}"{% endfor %}>
{% for node in page %}{{ render(node) }}{% endfor %}
<script>{{ javascript | safe }}</script>
</body>
</html>
